name: Sigma Healthcare

description: 'Sigma Healthcare is an Australian healthcare company that describes itself as a leading network of independent and franchised pharmacies across Australia, with a heritage spanning over 110 years. Its site presents its pharmacy brands (including Chemist Warehouse), a wholesale business with a pharmaceutical distribution network, 3PL/4PL logistics services, supplier programs and community pharmacy accounts, plus an investor centre and the Sigma Connect ordering portal. Added from the API Evangelist harvest backlog (source: australia-apidays-2026); no public developer API is advertised on its website.'

